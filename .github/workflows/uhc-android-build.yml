name: Build UHC Android Prototype

on:
  push:
    branches:
      - uhc-android-prototype
    paths:
      - "uhc-android/**"
      - ".github/workflows/uhc-android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Android wrapper
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          echo "Using preinstalled Android SDK at $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" version

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18.20"

      - name: Install web build helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y tree jq python3-venv
          python3 -m venv /tmp/uhc-venv
          /tmp/uhc-venv/bin/pip install jinja2-cli
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Fetch UHC browser-port source
        run: |
          git clone --depth=1 https://github.com/jennymaeleidig/unofficial-homestuck-collection-web.git /tmp/uhc-web
          cd /tmp/uhc-web
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/uhc-android/WEB_FRONTEND_COMMIT.txt"

      - name: Patch web fork for a local Android app
        working-directory: /tmp/uhc-web
        run: |
          python3 "$GITHUB_WORKSPACE/uhc-android/tools/patch_web.py" /tmp/uhc-web
          cp "$GITHUB_WORKSPACE/uhc-android/web/sburb-mobile.js" /tmp/uhc-web/public/sburb-mobile.js

      - name: Build UHC frontend for the private Android origins
        working-directory: /tmp/uhc-web
        env:
          ASSET_PACK_HREF: https://uhc-assets.local/
          ASSET_DIR: /assets/
          APP_VERSION: 0.1.16-android
          AUTH_SERVER_URL: ""
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          yarn install --frozen-lockfile --ignore-engines

          mkdir -p build
          (cd src && tar -cf - imods/ | gzip -9 - > imods.tar.gz)
          yarn exec node src/js/validation.js src/imods/ src/js/crc_imods.json
          tree -J src/imods | jq '. | walk(if type == "object" then (if .type == "file" then ({"key": (.name), "value": true}) elif has("contents") then {"key": (.name), "value": .contents|from_entries} else . end) else . end) | .[:-1] | from_entries' > build/webAppModTrees.json

          /tmp/uhc-venv/bin/jinja2 webapp/browser.js.j2 -o webapp/browser.js
          yarn run vue-cli-service build webapp/browser.js

          rm -rf "$GITHUB_WORKSPACE/uhc-android/app/src/main/assets/www"
          mkdir -p "$GITHUB_WORKSPACE/uhc-android/app/src/main/assets/www"
          cp -a dist/. "$GITHUB_WORKSPACE/uhc-android/app/src/main/assets/www/"

          # The hosted fork normally downloads Ruffle from a CDN. Android has no
          # INTERNET permission, so ship the fork's self-hosted Ruffle runtime.
          mkdir -p "$GITHUB_WORKSPACE/uhc-android/app/src/main/assets/www/ruffle"
          cp -a src/imods/_twoToThree/js/ruffle/. "$GITHUB_WORKSPACE/uhc-android/app/src/main/assets/www/ruffle/"
          test -f "$GITHUB_WORKSPACE/uhc-android/app/src/main/assets/www/ruffle/ruffle.js"

          if grep -R "unpkg.com/@ruffle-rs/ruffle" dist; then
            echo "Unexpected online Ruffle dependency remains in built frontend."
            exit 1
          fi

          echo "Bundled web files:"
          du -sh "$GITHUB_WORKSPACE/uhc-android/app/src/main/assets/www"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned release APK
        run: |
          gradle -p uhc-android --no-daemon :app:assembleRelease --stacktrace
          test -f uhc-android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign with stable public prototype key
        run: |
          mkdir -p /tmp/uhc-sign deliverable
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 \
            -o /tmp/uhc-sign/testkey.pk8
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem \
            -o /tmp/uhc-sign/testkey.x509.pem

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 \
            uhc-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/uhc-sign/aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key /tmp/uhc-sign/testkey.pk8 \
            --cert /tmp/uhc-sign/testkey.x509.pem \
            --out deliverable/UHC-Android-v0.1.16.apk \
            /tmp/uhc-sign/aligned.apk

      - name: Inspect APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging deliverable/UHC-Android-v0.1.16.apk | head -20
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs deliverable/UHC-Android-v0.1.16.apk

      - name: Package deliverables
        run: |
          cp uhc-android/README.md deliverable/README.md
          cp uhc-android/WEB_FRONTEND_COMMIT.txt deliverable/WEB_FRONTEND_COMMIT.txt

          zip -qr deliverable/UHC-Android-v0.1.16-source.zip uhc-android .github/workflows/uhc-android-build.yml \
            -x 'uhc-android/app/build/*' \
               'uhc-android/.gradle/*' \
               'uhc-android/app/src/main/assets/www/*'

          ls -lh deliverable

      - name: Upload APK and source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: UHC-Android-v0.1.16
          path: deliverable/*
          if-no-files-found: error
          retention-days: 7
